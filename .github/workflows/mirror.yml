name: Mirror to Gitea

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          GITEA_SSH_KEY_B64: ${{ secrets.GITEA_MIRROR_SSH_KEY_B64 }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$GITEA_SSH_KEY_B64" \
            | base64 --decode \
            > ~/.ssh/gitea_mirror

          chmod 600 ~/.ssh/gitea_mirror

          ssh-keyscan -H gitea.kood.tech \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host gitea.kood.tech
            HostName gitea.kood.tech
            User git
            IdentityFile ~/.ssh/gitea_mirror
            IdentitiesOnly yes
          EOF

          chmod 600 ~/.ssh/config

      - name: Validate SSH key
        run: |
          set -euo pipefail

          ssh-keygen -y \
            -f ~/.ssh/gitea_mirror \
            > /tmp/gitea_mirror.pub

          echo "Private key successfully loaded"

          ssh-keygen -lf /tmp/gitea_mirror.pub

      - name: Test Gitea SSH connection
        run: |
          set +e

          ssh -T git@gitea.kood.tech

          EXIT_CODE=$?

          echo "SSH exit code: $EXIT_CODE"

          # Gitea may intentionally reject interactive shell access.
          # Authentication can still be successful.
          exit 0

      - name: Add Gitea remote
        run: |
          set -euo pipefail

          git remote remove gitea 2>/dev/null || true

          git remote add gitea \
            git@gitea.kood.tech:vladimirnilov/i-love-shopping1.git

          git remote -v

      - name: Fetch all GitHub branches
        run: |
          set -euo pipefail

          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*'

      - name: Mirror branches to Gitea
        run: |
          set -euo pipefail

          git for-each-ref \
            --format='%(refname:strip=3)' \
            refs/remotes/origin/ \
          | while read -r branch; do

              if [ "$branch" = "HEAD" ]; then
                continue
              fi

              echo "Mirroring branch: $branch"

              git push \
                --force \
                gitea \
                "refs/remotes/origin/$branch:refs/heads/$branch"

            done

      - name: Fetch all GitHub tags
        run: |
          set -euo pipefail

          git fetch origin \
            --tags \
            --force

      - name: Mirror tags to Gitea
        run: |
          set -euo pipefail

          git push \
            --force \
            gitea \
            'refs/tags/*:refs/tags/*'

      - name: Mirror completed
        run: |
          echo "GitHub → Gitea mirror completed successfully"