name: Mirror to Gitea

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Gitea SSH
        env:
          GITEA_SSH_KEY: ${{ secrets.GITEA_MIRROR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$GITEA_SSH_KEY" > ~/.ssh/gitea_mirror
          chmod 600 ~/.ssh/gitea_mirror

          ssh-keyscan -H gitea.kood.tech >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat >> ~/.ssh/config <<EOF
          Host gitea.kood.tech
            HostName gitea.kood.tech
            User git
            IdentityFile ~/.ssh/gitea_mirror
            IdentitiesOnly yes
          EOF

          chmod 600 ~/.ssh/config

      - name: Add Gitea remote
        run: |
          git remote add gitea \
            git@gitea.kood.tech:vladimirnilov/i-love-shopping1.git

      - name: Mirror branches to Gitea
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          for branch in $(git for-each-ref \
            --format='%(refname:strip=3)' \
            refs/remotes/origin/); do

            if [ "$branch" = "HEAD" ]; then
              continue
            fi

            echo "Mirroring branch: $branch"

            git push --force gitea \
              "refs/remotes/origin/$branch:refs/heads/$branch"
          done

      - name: Mirror tags to Gitea
        run: |
          git fetch origin --tags --force

          git push --force gitea \
            'refs/tags/*:refs/tags/*'