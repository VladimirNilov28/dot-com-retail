spring:
  datasource:
    url: "jdbc:postgresql://127.0.0.1:5432/retail"
    username: retail
    password: retail
  # Hive Router's built-in GraphQL IDE (http://localhost:4002) is the
  # canonical local GraphQL editor; Spring/DGS GraphiQL is disabled. This is
  # the property Spring Boot's GraphQL autoconfiguration actually reads —
  # dgs.graphql.graphiql.enabled below does not disable it by itself.
  graphql:
    graphiql:
      enabled: false

# Host development defaults; Compose overrides these with service addresses.
kratos:
  admin-url: http://127.0.0.1:4434

hydra:
  admin-url: http://127.0.0.1:4445

cart:
  guest:
    secure: false
    allowed-origins:
      - http://localhost:3000
      - http://localhost:4002

dgs:
  graphql:
    graphiql:
      enabled: false
    introspection:
      enabled: true
