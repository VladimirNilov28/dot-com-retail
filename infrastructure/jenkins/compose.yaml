services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bytecore-jenkins
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - TZ=Europe/Tallinn
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home: