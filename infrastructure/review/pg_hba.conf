# Review stack only (mounted by infrastructure/compose.review.yml).
# Local socket: entrypoint init scripts and the container healthcheck.
local   all   all                 trust
# Every network client must use TLS; plaintext TCP connections are rejected.
hostssl all   all   0.0.0.0/0     scram-sha-256
hostssl all   all   ::/0          scram-sha-256
host    all   all   0.0.0.0/0     reject
host    all   all   ::/0          reject
