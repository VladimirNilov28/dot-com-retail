serve:
  public:
    port: 4444

  admin:
    port: 4445

urls:
  self:
    issuer: http://127.0.0.1:4444

  login: http://127.0.0.1:4446/login
  consent: http://127.0.0.1:4446/consent
  logout: http://127.0.0.1:3000/account

log:
  level: info
  format: text

oauth2:
  expose_internal_errors: false
  # Custom claims set via the consent session's access_token data are nested
  # under the "ext" claim unless explicitly whitelisted here — this promotes
  # "role" to a genuine top-level JWT claim so Spring's JWT authority
  # conversion (which reads a top-level `role` claim) can find it.
  allowed_top_level_claims:
    - role

# Short-lived access token (project requirement: 15-60 min) and a
# refresh-token lifetime bounded to a week (project requirement: 3-7
# days). Hydra's own defaults are 1h / 720h (30 days) — the refresh
# default is outside the target range, so both are pinned explicitly.
# Go duration syntax only supports ns/us/ms/s/m/h (no day unit), hence
# "168h" rather than "7d". NOTE: "ttl" is a root-level config key, not
# nested under "oauth2" (confirmed against Hydra's config.schema.json —
# oauth2 has additionalProperties: false and rejects an "ttl" key there).
ttl:
  access_token: 30m
  refresh_token: 168h

# JWT access tokens so the Spring resource server (which validates JWTs
# locally via the issuer's JWKS) can decode `sub` without an introspection
# call. Ory generally recommends opaque tokens + introspection instead
# (see docs), but this repo's resource server is already configured for
# JWT decoding, so this keeps the token consumable end-to-end for now.
strategies:
  access_token: jwt